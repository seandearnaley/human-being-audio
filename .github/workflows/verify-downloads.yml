name: Verify live downloads
run-name: Verify live downloads for ${{ inputs.tag }}

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Product tag currently offered on the live site (for example pole-field/v0.1.0)
        required: true
        type: string

permissions:
  contents: read
  attestations: read

jobs:
  downloads:
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps --only-shell chromium
      - name: Click the production buttons and verify the downloaded files
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: npx playwright test --config release --reporter=list
