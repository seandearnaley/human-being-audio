name: Pole Field

on: workflow_call

permissions:
  contents: read

env:
  PLUGINVAL_VERSION: v1.0.4
  CPM_SOURCE_CACHE: ${{ github.workspace }}/.cpm-cache
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_BASEDIR: ${{ github.workspace }}
  CCACHE_NOHASHDIR: 'true'
  CCACHE_COMPRESS: 'true'
  CCACHE_MAXSIZE: 1G
  ARTEFACTS: build/dev/plugin/PoleField_artefacts/RelWithDebInfo

defaults:
  run:
    working-directory: products/pole-field

jobs:
  engine:
    name: Core and engine
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - run: brew install ninja ccache
      - uses: actions/cache@v5
        with:
          path: .cpm-cache
          key: cpm-pf-engine-${{ hashFiles('products/pole-field/CMakeLists.txt', 'cmake/CPM.cmake') }}
          restore-keys: cpm-pf-engine-
      - uses: actions/cache@v5
        with:
          path: .ccache
          key: ccache-mac-pf-engine-${{ github.sha }}
          restore-keys: ccache-mac-pf-engine-
      - run: cmake --preset engine -DCPM_SOURCE_CACHE="$CPM_SOURCE_CACHE"
      - run: cmake --build --preset engine
      - run: ctest --preset engine

  plugin:
    name: Plugin
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - run: brew install ninja ccache
      - uses: actions/cache@v5
        with:
          path: .cpm-cache
          key: cpm-pf-plugin-${{ hashFiles('products/pole-field/CMakeLists.txt', 'cmake/CPM.cmake') }}
          restore-keys: cpm-pf-plugin-
      - uses: actions/cache@v5
        with:
          path: .ccache
          key: ccache-mac-pf-plugin-${{ github.sha }}
          restore-keys: ccache-mac-pf-plugin-
      - run: cmake --preset dev -DCPM_SOURCE_CACHE="$CPM_SOURCE_CACHE"
      - run: cmake --build --preset dev
      - run: ctest --preset dev

      - name: Validate with pluginval
        run: |
          curl -fsSL -o pluginval.zip \
            "https://github.com/Tracktion/pluginval/releases/download/${PLUGINVAL_VERSION}/pluginval_macOS.zip"
          unzip -q pluginval.zip
          pluginval.app/Contents/MacOS/pluginval --strictness-level 10 --validate-in-process \
            --skip-gui-tests --timeout-ms 300000 --validate "$ARTEFACTS/VST3/Pole Field.vst3"

      - uses: actions/upload-artifact@v6
        with:
          name: PoleField-macOS
          path: |
            products/pole-field/${{ env.ARTEFACTS }}/VST3
            products/pole-field/${{ env.ARTEFACTS }}/AU
            products/pole-field/${{ env.ARTEFACTS }}/Standalone
          if-no-files-found: error
