name: Studio website
on:
  pull_request:
    paths: ['web/**', 'studio.json', 'design/studio/**', 'products/*/press/screenshots/**', 'products/livecut-redux/docs/editor.png', '.github/workflows/website.yml']
  push:
    branches: [main]
    paths: ['web/**', 'studio.json', 'design/studio/**', 'products/*/press/screenshots/**', 'products/livecut-redux/docs/editor.png', '.github/workflows/website.yml']
  merge_group:
permissions:
  contents: read
jobs:
  catalogue:
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          STUDIO_RELEASES_TOKEN: ${{ github.token }}
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          STUDIO_RELEASES_TOKEN: ${{ github.token }}
