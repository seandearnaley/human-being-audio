name: Livecut Redux

on: workflow_call

permissions:
  contents: read

env:
  CTEST_PARALLEL_LEVEL: 4
  CMAKE_BUILD_PARALLEL_LEVEL: 4
  PLUGINVAL_VERSION: v1.0.4
  VST3SDK_TAG: v3.8.1_build_84
  ARTEFACTS: build/dev/Livecut_artefacts/RelWithDebInfo
  CPM_SOURCE_CACHE: ${{ github.workspace }}/.cpm-cache
  HBA_TOOLS_DIR: ${{ github.workspace }}/.tools
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_BASEDIR: ${{ github.workspace }}
  CCACHE_NOHASHDIR: 'true'
  CCACHE_COMPRESS: 'true'
  CCACHE_MAXSIZE: 500M

defaults:
  run:
    shell: bash
    working-directory: products/livecut-redux

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-26
            artifact: Livecut-Redux-macOS
            pluginval_zip: pluginval_macOS.zip
            pluginval_bin: pluginval.app/Contents/MacOS/pluginval
            exe_suffix: ""
          - name: Windows (x64)
            os: windows-2025-vs2026
            artifact: Livecut-Redux-Windows-x64
            pluginval_zip: pluginval_Windows.zip
            pluginval_bin: pluginval.exe
            exe_suffix: .exe

    steps:
      - uses: actions/checkout@v7

      - if: runner.os == 'macOS'
        run: brew install ninja ccache

      - uses: actions/cache@v5
        with:
          path: .cpm-cache
          key: cpm-v2-${{ hashFiles('cmake/StudioDependencies.cmake', 'cmake/CPM.cmake') }}
          restore-keys: cpm-v2-

      - uses: actions/cache@v5
        with:
          path: .ccache
          key: ccache-livecut-${{ runner.os }}-${{ github.sha }}
          restore-keys: ccache-livecut-${{ runner.os }}-

      - uses: actions/cache@v5
        if: runner.os == 'Windows'
        with:
          path: .tools
          key: ccache-win64-4.14.3

      - uses: actions/cache@v5
        with:
          path: .vst3validator
          key: vst3sdk-validator-${{ runner.os }}-${{ env.VST3SDK_TAG }}

      - uses: actions/cache@v5
        with:
          path: .pluginval
          key: pluginval-${{ runner.os }}-${{ env.PLUGINVAL_VERSION }}

      - name: Test installer preinstall script
        if: runner.os == 'macOS'
        run: tests/release/PreinstallTests.sh

      - name: Configure, build, and test (macOS)
        if: runner.os == 'macOS'
        run: |
          cmake --preset dev -DCPM_SOURCE_CACHE="$CPM_SOURCE_CACHE"
          cmake --build --preset dev
          ctest --preset dev

      - name: Configure, build, and test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: .
        run: ./cmake/windows-release.ps1 -Product livecut-redux -Preset dev

      - name: Build Steinberg VST3 validator (if not cached)
        if: runner.os == 'macOS'
        run: |
          VAL_BIN="$GITHUB_WORKSPACE/.vst3validator/validator"
          if [[ ! -x "$VAL_BIN" ]]; then
            git clone --depth 1 --branch "$VST3SDK_TAG" https://github.com/steinbergmedia/vst3sdk "$RUNNER_TEMP/vst3sdk"
            git -C "$RUNNER_TEMP/vst3sdk" submodule update --init --depth 1 base cmake pluginterfaces public.sdk
            cmake -S "$RUNNER_TEMP/vst3sdk" -B "$RUNNER_TEMP/vst3sdk/build" -G Ninja -DCMAKE_BUILD_TYPE=Release \
              -DSMTG_ENABLE_VST3_PLUGIN_EXAMPLES=OFF \
              -DSMTG_ENABLE_VST3_HOSTING_EXAMPLES=OFF \
              -DSMTG_ENABLE_VSTGUI_SUPPORT=OFF
            cmake --build "$RUNNER_TEMP/vst3sdk/build" --target validator --parallel
            mkdir -p "$GITHUB_WORKSPACE/.vst3validator"
            FOUND=$(find "$RUNNER_TEMP/vst3sdk/build/bin" -name validator -type f | head -n 1)
            cp "$FOUND" "$VAL_BIN"
            chmod +x "$VAL_BIN"
          fi

      - name: Build Steinberg VST3 validator (Windows, if not cached)
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: .
        run: |
          $valBin = Join-Path $env:GITHUB_WORKSPACE '.vst3validator\validator.exe'
          if (!(Test-Path $valBin)) {
            $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
            Import-Module "$vs\Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
            Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
            $sdk = Join-Path $env:RUNNER_TEMP 'vst3sdk'
            git clone --depth 1 --branch $env:VST3SDK_TAG https://github.com/steinbergmedia/vst3sdk $sdk
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            git -C $sdk submodule update --init --depth 1 base cmake pluginterfaces public.sdk
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            cmake -S $sdk -B "$sdk\build" -G Ninja -DCMAKE_BUILD_TYPE=Release `
              -DSMTG_ENABLE_VST3_PLUGIN_EXAMPLES=OFF `
              -DSMTG_ENABLE_VST3_HOSTING_EXAMPLES=OFF `
              -DSMTG_ENABLE_VSTGUI_SUPPORT=OFF
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            cmake --build "$sdk\build" --target validator --parallel
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            New-Item -ItemType Directory -Force -Path (Split-Path $valBin) | Out-Null
            $found = Get-ChildItem -Path "$sdk\build\bin" -Filter 'validator.exe' -Recurse | Select-Object -First 1
            if (!$found) { throw 'validator.exe not found after build' }
            Copy-Item -Path $found.FullName -Destination $valBin -Force
          }

      - name: Download pluginval (if not cached)
        run: |
          PV_BIN="$GITHUB_WORKSPACE/.pluginval/${{ matrix.pluginval_bin }}"
          if [[ ! -f "$PV_BIN" ]]; then
            mkdir -p "$GITHUB_WORKSPACE/.pluginval"
            curl -sSfL -o "$RUNNER_TEMP/pluginval.zip" "https://github.com/Tracktion/pluginval/releases/download/${PLUGINVAL_VERSION}/${{ matrix.pluginval_zip }}"
            unzip -q -o "$RUNNER_TEMP/pluginval.zip" -d "$GITHUB_WORKSPACE/.pluginval"
          fi

      - name: Validate VST3
        run: |
          "$GITHUB_WORKSPACE/.pluginval/${{ matrix.pluginval_bin }}" --strictness-level 10 --skip-gui-tests --timeout-ms 300000 \
            --vst3validator "$GITHUB_WORKSPACE/.vst3validator/validator${{ matrix.exe_suffix }}" \
            --validate "$ARTEFACTS/VST3/Livecut Redux.vst3"

      - name: Validate AU
        if: runner.os == 'macOS'
        run: |
          # macOS only finds an AU once it is installed and the registrar has rescanned.
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R "$ARTEFACTS/AU/Livecut Redux.component" ~/Library/Audio/Plug-Ins/Components/
          pkill -9 -x -u "$UID" AudioComponentRegistrar || [ "$?" -eq 1 ]  # exit 1 means it was not running
          auval -strict -v aumf Lvct Sdrn
          "$GITHUB_WORKSPACE/.pluginval/${{ matrix.pluginval_bin }}" --strictness-level 10 --skip-gui-tests --timeout-ms 300000 \
            --validate ~/"Library/Audio/Plug-Ins/Components/Livecut Redux.component"

      - name: Upload plugins
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            products/livecut-redux/${{ env.ARTEFACTS }}/VST3
            products/livecut-redux/${{ env.ARTEFACTS }}/AU
            products/livecut-redux/${{ env.ARTEFACTS }}/Standalone
          if-no-files-found: error
