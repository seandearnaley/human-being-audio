name: Tract Form

on:
  push:
    branches: [main]
    paths:
      - 'products/tract-form/**'
      - '!products/**/*.md'
      - '!products/*/press/**'
      - 'cmake/**'
      - 'modules/**'
      - 'studio.json'
      - '.gitmodules'
      - '.github/workflows/tract-form.yml'
  pull_request:
    paths:
      - 'products/tract-form/**'
      - '!products/**/*.md'
      - '!products/*/press/**'
      - 'cmake/**'
      - 'modules/**'
      - 'studio.json'
      - '.gitmodules'
      - '.github/workflows/tract-form.yml'
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PLUGINVAL_VERSION: v1.0.4
  CPM_SOURCE_CACHE: ${{ github.workspace }}/.cpm-cache
  ARTEFACTS: build/dev/plugin/TractForm_artefacts/RelWithDebInfo

defaults:
  run:
    working-directory: products/tract-form

jobs:
  engine:
    name: Core and engine
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - run: brew install ninja
      - uses: actions/cache@v5
        with:
          path: .cpm-cache
          key: cpm-engine-${{ hashFiles('products/tract-form/CMakeLists.txt', 'products/tract-form/cmake/CPM.cmake') }}
      - run: cmake --preset engine -DCPM_SOURCE_CACHE="$CPM_SOURCE_CACHE"
      - run: cmake --build --preset engine
      - run: ctest --preset engine

  plugin:
    name: Plugin
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - run: brew install ninja
      - uses: actions/cache@v5
        with:
          path: .cpm-cache
          key: cpm-plugin-${{ hashFiles('products/tract-form/CMakeLists.txt', 'products/tract-form/cmake/CPM.cmake') }}
      - run: cmake --preset dev -DCPM_SOURCE_CACHE="$CPM_SOURCE_CACHE"
      - run: cmake --build --preset dev
      - run: ctest --preset dev

      - name: Validate with pluginval
        run: |
          curl -fsSL -o pluginval.zip \
            "https://github.com/Tracktion/pluginval/releases/download/${PLUGINVAL_VERSION}/pluginval_macOS.zip"
          unzip -q pluginval.zip
          pluginval.app/Contents/MacOS/pluginval --strictness-level 10 --validate-in-process \
            --skip-gui-tests --timeout-ms 300000 --validate "$ARTEFACTS/VST3/Tract Form.vst3"

      - uses: actions/upload-artifact@v6
        with:
          name: TractForm-macOS
          path: |
            products/tract-form/${{ env.ARTEFACTS }}/VST3
            products/tract-form/${{ env.ARTEFACTS }}/AU
            products/tract-form/${{ env.ARTEFACTS }}/Standalone
          if-no-files-found: error
