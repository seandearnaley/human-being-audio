name: Studio checks
on:
  pull_request:
  merge_group:
  push:
    branches: [main]
    # PR and merge-group runs validate the combined tree. Only dependency or
    # toolchain changes need to populate caches visible to future branches.
    paths:
      - cmake/CPM.cmake
      - cmake/StudioDependencies.cmake
      - cmake/patches/**
      - cmake/ubuntu-26.04-packages.txt
      - cmake/windows-release.ps1

permissions:
  contents: read

concurrency:
  group: studio-checks-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  plan:
    runs-on: ubuntu-26.04
    outputs:
      jobs: ${{ steps.plan.outputs.jobs }}
      products: ${{ steps.plan.outputs.products }}
      macos: ${{ steps.plan.outputs.macos }}
      windows: ${{ steps.plan.outputs.windows }}
      windows_editor_only: ${{ steps.plan.outputs.windows_editor_only }}
      livecut_windows_only: ${{ steps.plan.outputs.livecut_windows_only }}
      base: ${{ steps.plan.outputs.base }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: python3 -m unittest discover -s factory/quality
      - id: plan
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          python3 factory/quality/native.py plan --base "$BASE" >> "$GITHUB_OUTPUT"

  format:
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.jobs), 'format')
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends clang-format-22
      - name: Check changed studio C++ lines
        env:
          BASE: ${{ needs.plan.outputs.base }}
        run: |
          if [[ -z "$BASE" || "$BASE" == "0000000000000000000000000000000000000000" ]] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "Skipping diff-only clang-format check: base commit '$BASE' is empty or unreachable."
            exit 0
          fi
          git-clang-format-22 --binary clang-format-22 --diff "$BASE" HEAD -- products modules research \
            ':(exclude,glob)**/third_party/**' ':(exclude,glob)**/libs/**'

  modules:
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.jobs), 'modules')
    name: Shared C++ modules
    runs-on: ubuntu-26.04
    env:
      CC: clang-22
      CXX: clang++-22
      CMAKE_BUILD_PARALLEL_LEVEL: 4
      CPM_SOURCE_CACHE: ${{ github.workspace }}/.cpm-cache
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_NOHASHDIR: 'true'
      CCACHE_COMPRESS: 'true'
      CCACHE_MAXSIZE: 250M
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache/restore@v5
        with:
          path: .cpm-cache
          key: cpm-plugin-v3-${{ runner.os }}-${{ hashFiles('cmake/StudioDependencies.cmake', 'cmake/CPM.cmake') }}-${{ runner.os == 'Windows' && hashFiles('cmake/patches/windows/**') || 'stock' }}
      - uses: actions/cache@v5
        with:
          path: .ccache
          key: ccache-modules-${{ github.sha }}
          restore-keys: ccache-modules-
      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends build-essential ca-certificates ccache clang-22 cmake git ninja-build
      - run: cmake -S modules -B modules/build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build modules/build
      - run: ctest --test-dir modules/build --output-on-failure

  ubuntu:
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.jobs), 'ubuntu')
    name: ${{ matrix.product }} · Ubuntu x64
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        product: ${{ fromJSON(needs.plan.outputs.products) }}
    env:
      CC: clang-22
      CXX: clang++-22
      CTEST_PARALLEL_LEVEL: ${{ contains(fromJSON('["livecut-redux","tract-form"]'), matrix.product) && '4' || '1' }}
      CMAKE_BUILD_PARALLEL_LEVEL: 4
      CPM_SOURCE_CACHE: ${{ github.workspace }}/.cpm-cache
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_NOHASHDIR: 'true'
      CCACHE_COMPRESS: 'true'
      CCACHE_MAXSIZE: 500M
    defaults:
      run:
        working-directory: products/${{ matrix.product }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/cache@v5
        with:
          path: .cpm-cache
          key: cpm-plugin-v3-${{ runner.os }}-${{ hashFiles('cmake/StudioDependencies.cmake', 'cmake/CPM.cmake') }}-${{ runner.os == 'Windows' && hashFiles('cmake/patches/windows/**') || 'stock' }}
      - uses: actions/cache@v5
        with:
          path: .ccache
          key: ccache-ubuntu-${{ matrix.product }}-${{ github.sha }}
          restore-keys: |
            ccache-ubuntu-${{ matrix.product }}-
      - name: Install build dependencies
        working-directory: .
        run: |
          sudo apt-get update -qq
          xargs -a cmake/ubuntu-26.04-packages.txt sudo apt-get install -y --no-install-recommends clang-tidy-22
      - run: cmake --preset release
      - run: cmake --build --preset release
      - run: xvfb-run -a ../../cmake/with-window-manager.sh ctest --preset release
      - name: Check studio C++ with clang-tidy
        env:
          HBA_QUALITY_BASE: ${{ needs.plan.outputs.base }}
        run: cmake --build build/release --target studio-lint

  realtime:
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.jobs), 'realtime')
    name: ${{ matrix.product }} · RealtimeSanitizer
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        product: ${{ fromJSON(needs.plan.outputs.products) }}
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 4
      CPM_SOURCE_CACHE: ${{ github.workspace }}/.cpm-cache
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_NOHASHDIR: 'true'
      CCACHE_COMPRESS: 'true'
      CCACHE_MAXSIZE: 500M
    defaults:
      run:
        working-directory: products/${{ matrix.product }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache/restore@v5
        with:
          path: .cpm-cache
          key: cpm-plugin-v3-${{ runner.os }}-${{ hashFiles('cmake/StudioDependencies.cmake', 'cmake/CPM.cmake') }}-${{ runner.os == 'Windows' && hashFiles('cmake/patches/windows/**') || 'stock' }}
      - uses: actions/cache@v5
        with:
          path: .ccache
          key: ccache-rtsan-${{ matrix.product }}-${{ github.sha }}
          restore-keys: |
            ccache-rtsan-${{ matrix.product }}-
      - name: Install LLVM and engine build dependencies
        working-directory: .
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends build-essential ca-certificates ccache clang-22 cmake git libclang-rt-22-dev ninja-build
      - run: cmake --workflow --preset rtsan
        env:
          CTEST_PARALLEL_LEVEL: 4

  windows:
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.jobs), 'windows')
    name: ${{ matrix.product == 'torus-glide' && fromJSON(needs.plan.outputs.windows_editor_only) && 'Shared editor' || matrix.product }} · Windows x64
    runs-on: windows-2025-vs2026
    strategy:
      fail-fast: false
      matrix:
        product: ${{ fromJSON(needs.plan.outputs.windows) }}
    env:
      CTEST_PARALLEL_LEVEL: ${{ matrix.product == 'tract-form' && '4' || '1' }}
      CMAKE_BUILD_PARALLEL_LEVEL: 4
      CPM_SOURCE_CACHE: ${{ github.workspace }}/.cpm-cache
      HBA_TOOLS_DIR: ${{ github.workspace }}/.tools
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_NOHASHDIR: 'true'
      CCACHE_COMPRESS: 'true'
      CCACHE_MAXSIZE: 500M
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v5
        with:
          path: .cpm-cache
          key: cpm-plugin-v3-${{ runner.os }}-${{ hashFiles('cmake/StudioDependencies.cmake', 'cmake/CPM.cmake') }}-${{ runner.os == 'Windows' && hashFiles('cmake/patches/windows/**') || 'stock' }}
      - uses: actions/cache@v5
        with:
          path: C:\Program Files\LLVM
          key: llvm-win64-23.1.6
      - uses: actions/cache@v5
        with:
          path: .tools
          key: ccache-win64-4.14.3
      - uses: actions/cache@v5
        with:
          path: .ccache
          key: ccache-windows-${{ matrix.product }}-${{ github.sha }}
          restore-keys: |
            ccache-windows-${{ matrix.product }}-
      - shell: pwsh
        env:
          PRODUCT: ${{ matrix.product }}
          PRESET: ${{ matrix.product == 'torus-glide' && fromJSON(needs.plan.outputs.windows_editor_only) && 'windows-editor' || 'release' }}
        run: ./cmake/windows-release.ps1 -Product $env:PRODUCT -Preset $env:PRESET

  macos:
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.jobs), 'macos')
    strategy:
      fail-fast: false
      matrix:
        product: ${{ fromJSON(needs.plan.outputs.macos) }}
    uses: ./.github/workflows/macos-product.yml
    with:
      product: ${{ matrix.product }}

  livecut:
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.jobs), 'livecut')
    uses: ./.github/workflows/livecut.yml
    with:
      windows_only: ${{ fromJSON(needs.plan.outputs.livecut_windows_only) }}

  website:
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.jobs), 'website')
    uses: ./.github/workflows/website.yml

  factory:
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.jobs), 'factory')
    uses: ./.github/workflows/factory.yml

  required:
    name: Studio PR checks
    if: always()
    needs: [plan, format, modules, ubuntu, realtime, windows, macos, livecut, website, factory]
    runs-on: ubuntu-26.04
    steps:
      - name: Require success from every selected job
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          jq -e '
            ((.plan.outputs.jobs | fromjson) + ["plan"]) as $expected |
            (keys | contains($expected)) and
            all(to_entries[]; .key as $job |
              .value.result == (if $expected | index($job) then "success" else "skipped" end))
          ' <<< "$RESULTS"
