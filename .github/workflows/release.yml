name: Studio release
run-name: ${{ inputs.publish && 'Publish' || 'Qualify' }} ${{ inputs.product }} from ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      product:
        description: Product to package
        type: choice
        options: [livecut-redux, tract-form, pole-field, cutline, torus-glide, strike-body, lineage, datum, prism-vein, ligature]
        required: true
      publish:
        description: Publish the verified draft immediately
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: studio-release-${{ inputs.product }}
  cancel-in-progress: false

env:
  PRODUCT: ${{ inputs.product }}
  CMAKE_BUILD_PARALLEL_LEVEL: 4
  CPM_SOURCE_CACHE: ${{ github.workspace }}/.cpm-cache
  HBA_TOOLS_DIR: ${{ github.workspace }}/.tools
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_BASEDIR: ${{ github.workspace }}
  CCACHE_NOHASHDIR: 'true'
  CCACHE_COMPRESS: 'true'
  CCACHE_MAXSIZE: 500M

jobs:
  prepare:
    permissions:
      contents: write
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: python3 factory/release/release.py env "$PRODUCT"
      - name: Check source and version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REF" = refs/heads/main
          python3 -m unittest discover -s factory/release
          refs=$(git ls-remote --tags origin "refs/tags/$TAG" "refs/tags/archive/$PRODUCT/tags/v$VERSION")
          if [[ -n $refs ]]; then echo "::error::This version already has a release tag. Bump the product version first."; exit 1; fi
          drafts=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq '.[].tag_name')
          if grep -Fxq "$TAG" <<<"$drafts"; then
            gh release view "$TAG" --json isDraft,targetCommitish | jq -e --arg sha "$GITHUB_SHA" '.isDraft and .targetCommitish == $sha'
          else
            python3 factory/release/release.py notes "$PRODUCT" > "$RUNNER_TEMP/notes"
            gh release create "$TAG" --draft --target "$GITHUB_SHA" --title "$NAME $VERSION" --notes-file "$RUNNER_TEMP/notes"
          fi

  package:
    needs: prepare
    environment: release
    permissions:
      contents: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, windows-2025-vs2026, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    env:
      CTEST_PARALLEL_LEVEL: ${{ contains(fromJSON('["livecut-redux","tract-form"]'), inputs.product) && '4' || '1' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/cache@v5
        with:
          path: .cpm-cache
          key: cpm-plugin-v3-${{ runner.os }}-${{ hashFiles('cmake/StudioDependencies.cmake', 'cmake/CPM.cmake') }}-${{ runner.os == 'Windows' && hashFiles('cmake/patches/windows/**') || 'stock' }}
      - uses: actions/cache@v5
        if: runner.os == 'Windows'
        with:
          path: C:\Program Files\LLVM
          key: llvm-win64-23.1.6
      - uses: actions/cache@v5
        if: runner.os == 'Windows'
        with:
          path: .tools
          key: ccache-win64-4.14.3
      - name: Identify the universal macOS compiler cache
        if: runner.os == 'macOS'
        id: mac-toolchain
        run: |
          command -v ccache >/dev/null || brew install ccache
          echo "version=$(xcrun clang --version | head -1)-$(xcrun --show-sdk-version)" >> "$GITHUB_OUTPUT"
          echo "CCACHE_MAXSIZE=200M" >> "$GITHUB_ENV"
      - uses: actions/cache@v5
        if: runner.os == 'macOS'
        with:
          path: .ccache
          key: ccache-universal-release-v1-${{ inputs.product }}-${{ steps.mac-toolchain.outputs.version }}-${{ hashFiles('cmake/StudioDependencies.cmake', 'cmake/native-presets.json', 'cmake/StudioHelpers.cmake') }}
      - name: Export release environment
        run: |
          PY=$(command -v python3 || command -v python)
          "$PY" factory/release/release.py env "$PRODUCT"
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          xargs -a cmake/ubuntu-26.04-packages.txt sudo apt-get install -y --no-install-recommends
          echo CC=clang-22 >> "$GITHUB_ENV"
          echo CXX=clang++-22 >> "$GITHUB_ENV"
      - name: Build Release and run the native tests
        if: runner.os != 'Windows'
        working-directory: products/${{ inputs.product }}
        run: |
          cmake --preset release
          cmake --build --preset release
          if [[ $RUNNER_OS == Linux ]]; then
            xvfb-run -a ../../cmake/with-window-manager.sh ctest --preset release
          else
            ccache --show-stats
            ctest --preset release
          fi
      - name: Build Release and run the native Windows tests
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./cmake/windows-release.ps1 -Product $env:PRODUCT

      - name: Sign Mac bundles and install the notarized package
        if: runner.os == 'macOS'
        env:
          MACOS_APPLICATION_IDENTITY: ${{ secrets.MACOS_APPLICATION_IDENTITY }}
          MACOS_INSTALLER_IDENTITY: ${{ secrets.MACOS_INSTALLER_IDENTITY }}
          MACOS_APPLICATION_P12: ${{ secrets.MACOS_APPLICATION_P12 }}
          MACOS_INSTALLER_P12: ${{ secrets.MACOS_INSTALLER_P12 }}
          MACOS_P12_PASSWORD: ${{ secrets.MACOS_P12_PASSWORD }}
          NOTARY_API_KEY: ${{ secrets.NOTARY_API_KEY }}
          NOTARY_API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_API_ISSUER_ID: ${{ secrets.NOTARY_API_ISSUER_ID }}
        run: bash factory/release/notarize.sh
      - uses: actions/setup-python@v6
        if: runner.os == 'macOS'
        with:
          python-version: '3.12'
      - name: Validate the installed Mac Audio Unit, VST3 and standalone
        if: runner.os == 'macOS'
        run: |
          # The runner's AU registry may predate the just-installed bundle.
          pkill -9 -x -u "$UID" AudioComponentRegistrar || [ "$?" -eq 1 ]
          plist="/Library/Audio/Plug-Ins/Components/$NAME.component/Contents/Info.plist"
          auval -strict -v "$(plutil -extract AudioComponents.0.type raw -o - "$plist")" \
            "$(plutil -extract AudioComponents.0.subtype raw -o - "$plist")" \
            "$(plutil -extract AudioComponents.0.manufacturer raw -o - "$plist")"
          python3 factory/release/verify_product.py "$PRODUCT" "/Library/Audio/Plug-Ins/VST3/$NAME.vst3"
          python -m pip install --only-binary=:all: pedalboard==0.9.26
          python factory/release/verify_recall.py "$PRODUCT" "/Library/Audio/Plug-Ins/VST3/$NAME.vst3"
          swift factory/release/standalone-mac.swift "/Applications/$NAME.app"
          bash factory/release/pluginval.sh "/Library/Audio/Plug-Ins/VST3/$NAME.vst3"

      - name: Log in to the Windows signing profile with GitHub OIDC
        if: runner.os == 'Windows'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Sign the Windows standalone and VST3 payloads
        if: runner.os == 'Windows'
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_SIGNING_PROFILE }}
          files: |
            ${{ env.ARTIFACTS }}\Standalone\${{ env.NAME }}.exe
            ${{ env.ARTIFACTS }}\VST3\${{ env.NAME }}.vst3\Contents\x86_64-win\${{ env.NAME }}.vst3
      - name: Build the Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
        run: |
          choco install nsis --version=3.13 --yes --no-progress
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          New-Item -ItemType Directory dist | Out-Null
          & "${env:ProgramFiles(x86)}\NSIS\makensis.exe" /V2 factory/release/windows.nsi
      - name: Sign the finished Windows installer
        if: runner.os == 'Windows'
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_SIGNING_PROFILE }}
          files: ${{ github.workspace }}\dist\${{ env.WINDOWS_FILE }}
      - name: Install, verify signatures, validate VST3 and uninstall
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./factory/release/windows-test.ps1

      - name: Install the Linux archive and validate the packaged VST3
        if: runner.os == 'Linux'
        run: |
          bash factory/release/linux.sh
          mkdir -p "$RUNNER_TEMP/installed" "$HOME/.vst3"
          tar -xzf "dist/$LINUX_FILE" -C "$RUNNER_TEMP/installed"
          cp -a "$RUNNER_TEMP/installed/$NAME/VST3/$NAME.vst3" "$HOME/.vst3/"
          python3 factory/release/verify_product.py "$PRODUCT" "$HOME/.vst3/$NAME.vst3"
          xvfb-run -a cmake/with-window-manager.sh /usr/bin/python3 factory/release/standalone-linux.py "$RUNNER_TEMP/installed/$NAME/Standalone/$NAME"
          xvfb-run -a cmake/with-window-manager.sh bash factory/release/pluginval.sh "$HOME/.vst3/$NAME.vst3"

      - name: Stage the tested package in the private draft
        env:
          PACKAGE_FILE: ${{ runner.os == 'macOS' && env.MACOS_FILE || runner.os == 'Windows' && env.WINDOWS_FILE || env.LINUX_FILE }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" --json isDraft,targetCommitish | jq -e --arg sha "$GITHUB_SHA" '.isDraft and .targetCommitish == $sha'
          gh release upload "$TAG" "dist/$PACKAGE_FILE" --clobber

  finalize:
    outputs:
      tag: ${{ steps.published.outputs.tag }}
    needs: package
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: python3 factory/release/release.py env "$PRODUCT"
      - name: Collect the three tested packages from the private draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" --json isDraft,targetCommitish | jq -e --arg sha "$GITHUB_SHA" '.isDraft and .targetCommitish == $sha'
          gh release download "$TAG" -D dist -p "$MACOS_FILE" -p "$WINDOWS_FILE" -p "$LINUX_FILE"
      - run: python3 factory/release/release.py record "$PRODUCT"
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*
      - name: Verify the candidate and attach its manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd dist && sha256sum -c SHA256SUMS)
          for file in dist/*; do gh attestation verify "$file" --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" --source-digest "$GITHUB_SHA"; done
          gh release upload "$TAG" dist/release.json dist/SHA256SUMS --clobber
      - name: Publish the verified draft
        id: published
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit "$TAG" --draft=false --latest=false
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  verify-downloads:
    needs: finalize
    if: inputs.publish
    permissions:
      contents: read
      attestations: read
    uses: ./.github/workflows/verify-downloads.yml
    with:
      tag: ${{ needs.finalize.outputs.tag }}
