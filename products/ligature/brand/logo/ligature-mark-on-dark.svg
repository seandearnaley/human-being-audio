<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="112" fill="#090d14"/>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Subtle Tonnetz ring -->
    <circle cx="256" cy="256" r="176" stroke="#1c2534" stroke-width="10"/>
    <!-- Harmonic ligature slur bridge connecting Key A (cyan) through Pivot (violet) to Key B (amber) -->
    <path d="M126,304 C154,136 358,136 386,304" stroke="#a884ff" stroke-width="26"/>
    <path d="M126,304 C188,244 324,244 386,304" stroke="#38e8ff" stroke-width="16" stroke-opacity="0.72"/>
    <!-- Key A node -->
    <circle cx="126" cy="304" r="40" fill="#090d14" stroke="#38e8ff" stroke-width="20"/>
    <circle cx="126" cy="304" r="12" fill="#38e8ff"/>
    <!-- Bridge apex pivot node -->
    <circle cx="256" cy="176" r="24" fill="#a884ff"/>
    <!-- Key B node -->
    <circle cx="386" cy="304" r="40" fill="#090d14" stroke="#f5a638" stroke-width="20"/>
    <circle cx="386" cy="304" r="12" fill="#f5a638"/>
  </g>
</svg>
